rule_files:
  - ../ovnk-observ-rules.yaml

evaluation_interval: 1m

tests:
  # Port-group amplification: 474791 PortGroups / (3150 MNP + 157 NP).
  - interval: 1m
    input_series:
      - series: 'ovnkube_controller_nb_db_objects{node="A",table="Port_Group",owner_type="NetworkPolicy",network="default"}'
        values: '474791x30'
      - series: 'ovnkube_clustermanager_multi_network_policies{namespace="ns1",pod="cm-old"}'
        values: '3150x30'
      - series: 'ovnkube_clustermanager_network_policies{namespace="ns1",pod="cm-old"}'
        values: '157x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: OVNKPortGroupAmplificationHigh
        exp_alerts: []
      - eval_time: 16m
        alertname: OVNKPortGroupAmplificationHigh
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Port_Group amplification is 143.6 NB Port_Groups per policy"
    promql_expr_test:
      - expr: ovnk:portgroup_amplification:ratio * 3307
        eval_time: 5m
        exp_samples:
          - labels: '{}'
            value: 474791

  # Rollout: two cluster-manager pods report the same counts; ratio unchanged.
  - interval: 1m
    input_series:
      - series: 'ovnkube_controller_nb_db_objects{node="A",table="Port_Group",owner_type="NetworkPolicy",network="default"}'
        values: '474791x30'
      - series: 'ovnkube_clustermanager_multi_network_policies{namespace="ns1",pod="cm-old",instance="1.1.1.1:9410"}'
        values: '3150x30'
      - series: 'ovnkube_clustermanager_multi_network_policies{namespace="ns1",pod="cm-new",instance="1.1.1.2:9410"}'
        values: '3150x30'
      - series: 'ovnkube_clustermanager_network_policies{namespace="ns1",pod="cm-old",instance="1.1.1.1:9410"}'
        values: '157x30'
      - series: 'ovnkube_clustermanager_network_policies{namespace="ns1",pod="cm-new",instance="1.1.1.2:9410"}'
        values: '157x30'
    promql_expr_test:
      - expr: ovnk:portgroup_amplification:ratio * 3307
        eval_time: 5m
        exp_samples:
          - labels: '{}'
            value: 474791

  # No fire when amplification is low.
  - interval: 1m
    input_series:
      - series: 'ovnkube_controller_nb_db_objects{node="A",table="Port_Group",owner_type="NetworkPolicy",network="default"}'
        values: '200x40'
      - series: 'ovnkube_clustermanager_multi_network_policies{namespace="ns1",pod="cm"}'
        values: '0x40'
      - series: 'ovnkube_clustermanager_network_policies{namespace="ns1",pod="cm"}'
        values: '100x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: OVNKPortGroupAmplificationHigh
        exp_alerts: []
    promql_expr_test:
      - expr: ovnk:portgroup_amplification:ratio
        eval_time: 5m
        exp_samples:
          - labels: 'ovnk:portgroup_amplification:ratio'
            value: 2

  # No MultiNetworkPolicy series at all (cluster without MNPs): ratio still
  # computed from NetworkPolicies alone.
  - interval: 1m
    input_series:
      - series: 'ovnkube_controller_nb_db_objects{node="A",table="Port_Group",owner_type="NetworkPolicy",network="default"}'
        values: '300x10'
      - series: 'ovnkube_clustermanager_network_policies{namespace="ns1",pod="cm"}'
        values: '100x10'
    promql_expr_test:
      - expr: ovnk:portgroup_amplification:ratio
        eval_time: 5m
        exp_samples:
          - labels: 'ovnk:portgroup_amplification:ratio'
            value: 3

  # No NetworkPolicy series at all: ratio computed from MNPs alone.
  - interval: 1m
    input_series:
      - series: 'ovnkube_controller_nb_db_objects{node="A",table="Port_Group",owner_type="NetworkPolicy",network="default"}'
        values: '300x10'
      - series: 'ovnkube_clustermanager_multi_network_policies{namespace="ns1",pod="cm"}'
        values: '50x10'
    promql_expr_test:
      - expr: ovnk:portgroup_amplification:ratio
        eval_time: 5m
        exp_samples:
          - labels: 'ovnk:portgroup_amplification:ratio'
            value: 6

  # NB/SB effectiveness.
  - interval: 1m
    input_series:
      - series: 'ovnkube_controller_sb_db_objects{node="A",table="Logical_Flow"}'
        values: '1562x10'
      - series: 'ovnkube_controller_nb_db_objects{node="A",table="ACL",owner_type="none",network="default"}'
        values: '464102x10'
    promql_expr_test:
      - expr: ovnk:nb_sb_effectiveness:ratio * 464102
        eval_time: 5m
        exp_samples:
          - labels: '{node="A"}'
            value: 1562

  # Transaction failure ratio, joined to node via kube_pod_info.
  - interval: 1m
    input_series:
      - series: 'ovn_northd_txn_success{namespace="openshift-ovn-kubernetes",pod="ovnkube-node-x"}'
        values: '0+100x30'
      - series: 'ovn_northd_txn_try_again{namespace="openshift-ovn-kubernetes",pod="ovnkube-node-x"}'
        values: '0+10x30'
      - series: 'ovn_northd_txn_error{namespace="openshift-ovn-kubernetes",pod="ovnkube-node-x"}'
        values: '0x30'
      - series: 'ovn_northd_txn_aborted{namespace="openshift-ovn-kubernetes",pod="ovnkube-node-x"}'
        values: '0x30'
      - series: 'kube_pod_info{namespace="openshift-ovn-kubernetes",pod="ovnkube-node-x",node="A"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: OVNKTxnFailureRatioHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              component: northd
              node: A
              namespace: openshift-ovn-kubernetes
              pod: ovnkube-node-x
            exp_annotations:
              summary: "OVN northd transaction failure ratio on A is 0.0909"
    promql_expr_test:
      - expr: round(ovnk:ovn_txn_failure:ratio_5m * 110, 0.01)
        eval_time: 10m
        exp_samples:
          - labels: '{component="northd",node="A",namespace="openshift-ovn-kubernetes",pod="ovnkube-node-x"}'
            value: 10

  # Propagation lag.
  - interval: 1m
    input_series:
      - series: 'ovnkube_controller_nb_e2e_timestamp{namespace="openshift-ovn-kubernetes",pod="ovnkube-node-x"}'
        values: '1000x30'
      - series: 'ovnkube_controller_sb_e2e_timestamp{namespace="openshift-ovn-kubernetes",pod="ovnkube-node-x"}'
        values: '950x30'
      - series: 'kube_pod_info{namespace="openshift-ovn-kubernetes",pod="ovnkube-node-x",node="A"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 16m
        alertname: OVNKPropagationLagHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              node: A
              namespace: openshift-ovn-kubernetes
              pod: ovnkube-node-x
            exp_annotations:
              summary: "NB to SB propagation lag on A is 50s"
    promql_expr_test:
      - expr: ovnk:nb_sb_e2e_lag_seconds
        eval_time: 5m
        exp_samples:
          - labels: 'ovnk:nb_sb_e2e_lag_seconds{node="A",namespace="openshift-ovn-kubernetes",pod="ovnkube-node-x"}'
            value: 50

  # NB database growing 1e6 bytes/min = 60 MB/h for 2h.
  - interval: 1m
    input_series:
      - series: 'ovn_db_db_size_bytes{namespace="openshift-ovn-kubernetes",pod="ovnkube-node-x",db_name="OVN_Northbound"}'
        values: '0+1000000x120'
      - series: 'kube_pod_info{namespace="openshift-ovn-kubernetes",pod="ovnkube-node-x",node="A"}'
        values: '1x120'
    alert_rule_test:
      - eval_time: 30m
        alertname: OVNKNBDBGrowing
        exp_alerts: []
      - eval_time: 75m
        alertname: OVNKNBDBGrowing
        exp_alerts:
          - exp_labels:
              severity: warning
              db_name: OVN_Northbound
              node: A
              namespace: openshift-ovn-kubernetes
              pod: ovnkube-node-x
            exp_annotations:
              summary: "OVN Northbound DB on A is growing 60MB/h"

  # Rollout overlap: old and new node-mode exporter pods for the same node are
  # both scraped and report the same counts. Per-node sums must not double.
  - interval: 1m
    input_series:
      - series: 'ovnkube_controller_nb_db_objects{node="A",table="ACL",owner_type="NetworkPolicy",network="default",namespace="ovnk-observ",pod="node-old",instance="10.0.0.1:9410",endpoint="metrics",container="exporter",service="ovnk-observ-node"}'
        values: '464102x10'
      - series: 'ovnkube_controller_nb_db_objects{node="A",table="ACL",owner_type="NetworkPolicy",network="default",namespace="ovnk-observ",pod="node-new",instance="10.0.0.2:9410",endpoint="metrics",container="exporter",service="ovnk-observ-node"}'
        values: '464102x10'
      - series: 'ovnkube_controller_nb_db_objects{node="A",table="Port_Group",owner_type="NetworkPolicy",network="default",namespace="ovnk-observ",pod="node-old",instance="10.0.0.1:9410",endpoint="metrics",container="exporter",service="ovnk-observ-node"}'
        values: '474791x10'
      - series: 'ovnkube_controller_nb_db_objects{node="A",table="Port_Group",owner_type="NetworkPolicy",network="default",namespace="ovnk-observ",pod="node-new",instance="10.0.0.2:9410",endpoint="metrics",container="exporter",service="ovnk-observ-node"}'
        values: '474791x10'
      - series: 'ovnkube_controller_sb_db_objects{node="A",table="Logical_Flow",namespace="ovnk-observ",pod="node-old",instance="10.0.0.1:9410",endpoint="metrics",container="exporter",service="ovnk-observ-node"}'
        values: '1562x10'
      - series: 'ovnkube_controller_sb_db_objects{node="A",table="Logical_Flow",namespace="ovnk-observ",pod="node-new",instance="10.0.0.2:9410",endpoint="metrics",container="exporter",service="ovnk-observ-node"}'
        values: '1562x10'
      - series: 'ovnkube_clustermanager_multi_network_policies{namespace="ns1",pod="cm"}'
        values: '3150x10'
      - series: 'ovnkube_clustermanager_network_policies{namespace="ns1",pod="cm"}'
        values: '157x10'
    promql_expr_test:
      - expr: ovnk:nb_db_objects:sum_by_node_table{table="ACL"}
        eval_time: 5m
        exp_samples:
          - labels: 'ovnk:nb_db_objects:sum_by_node_table{node="A",table="ACL"}'
            value: 464102
      - expr: ovnk:nb_db_objects:max_by_table{table="ACL"}
        eval_time: 5m
        exp_samples:
          - labels: 'ovnk:nb_db_objects:max_by_table{table="ACL"}'
            value: 464102
      - expr: ovnk:nb_db_objects:max_by_network_table{table="ACL"}
        eval_time: 5m
        exp_samples:
          - labels: 'ovnk:nb_db_objects:max_by_network_table{network="default",table="ACL"}'
            value: 464102
      - expr: ovnk:portgroup_amplification:ratio * 3307
        eval_time: 5m
        exp_samples:
          - labels: '{}'
            value: 474791
      - expr: ovnk:nb_sb_effectiveness:ratio * 464102
        eval_time: 5m
        exp_samples:
          - labels: '{node="A"}'
            value: 1562

  # Network programming p99 over 1h, overall and by kind. pod events land in
  # (0,1], networkpolicy events in (10,20], 100/min each.
  - interval: 1m
    input_series:
      - series: 'ovnkube_controller_network_programming_duration_seconds_bucket{namespace="openshift-ovn-kubernetes",pod="ovnkube-node-x",kind="pod",le="1"}'
        values: '0+100x60'
      - series: 'ovnkube_controller_network_programming_duration_seconds_bucket{namespace="openshift-ovn-kubernetes",pod="ovnkube-node-x",kind="pod",le="10"}'
        values: '0+100x60'
      - series: 'ovnkube_controller_network_programming_duration_seconds_bucket{namespace="openshift-ovn-kubernetes",pod="ovnkube-node-x",kind="pod",le="20"}'
        values: '0+100x60'
      - series: 'ovnkube_controller_network_programming_duration_seconds_bucket{namespace="openshift-ovn-kubernetes",pod="ovnkube-node-x",kind="pod",le="+Inf"}'
        values: '0+100x60'
      - series: 'ovnkube_controller_network_programming_duration_seconds_bucket{namespace="openshift-ovn-kubernetes",pod="ovnkube-node-x",kind="networkpolicy",le="1"}'
        values: '0x60'
      - series: 'ovnkube_controller_network_programming_duration_seconds_bucket{namespace="openshift-ovn-kubernetes",pod="ovnkube-node-x",kind="networkpolicy",le="10"}'
        values: '0x60'
      - series: 'ovnkube_controller_network_programming_duration_seconds_bucket{namespace="openshift-ovn-kubernetes",pod="ovnkube-node-x",kind="networkpolicy",le="20"}'
        values: '0+100x60'
      - series: 'ovnkube_controller_network_programming_duration_seconds_bucket{namespace="openshift-ovn-kubernetes",pod="ovnkube-node-x",kind="networkpolicy",le="+Inf"}'
        values: '0+100x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: OVNKNetworkProgrammingSlow
        exp_alerts: []
      - eval_time: 20m
        alertname: OVNKNetworkProgrammingSlow
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Network programming p99 latency is 19.8s"
              description: "p99 over a 1h window, so a single slow burst keeps this alert active for up to ~1h."
    promql_expr_test:
      - expr: round(ovnk:network_programming:p99_1h, 0.001)
        eval_time: 30m
        exp_samples:
          - labels: '{}'
            value: 19.8
      - expr: round(ovnk:network_programming:p99_1h_by_kind, 0.001)
        eval_time: 30m
        exp_samples:
          - labels: '{kind="pod"}'
            value: 0.99
          - labels: '{kind="networkpolicy"}'
            value: 19.9

  # Sparse events: one burst at minute 5, then quiet. A 5m window would give
  # NaN at minute 40; the 1h window still reports the burst's p99.
  - interval: 1m
    input_series:
      - series: 'ovnkube_controller_network_programming_duration_seconds_bucket{namespace="openshift-ovn-kubernetes",pod="ovnkube-node-x",kind="pod",le="1"}'
        values: '0x60'
      - series: 'ovnkube_controller_network_programming_duration_seconds_bucket{namespace="openshift-ovn-kubernetes",pod="ovnkube-node-x",kind="pod",le="10"}'
        values: '0x4 10x55'
      - series: 'ovnkube_controller_network_programming_duration_seconds_bucket{namespace="openshift-ovn-kubernetes",pod="ovnkube-node-x",kind="pod",le="+Inf"}'
        values: '0x4 10x55'
      - series: 'ovnkube_controller_pod_first_seen_lsp_created_duration_seconds_bucket{namespace="openshift-ovn-kubernetes",pod="ovnkube-node-x",le="1"}'
        values: '0x4 10x55'
      - series: 'ovnkube_controller_pod_first_seen_lsp_created_duration_seconds_bucket{namespace="openshift-ovn-kubernetes",pod="ovnkube-node-x",le="+Inf"}'
        values: '0x4 10x55'
    promql_expr_test:
      - expr: round(ovnk:network_programming:p99_1h, 0.001)
        eval_time: 40m
        exp_samples:
          - labels: '{}'
            value: 9.91
      - expr: round(ovnk:pod_setup_stage:p99_1h, 0.001)
        eval_time: 40m
        exp_samples:
          - labels: '{stage="first_seen_lsp"}'
            value: 0.99
