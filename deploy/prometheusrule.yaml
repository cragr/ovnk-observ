# Generated by 'make rules-gen' from rules/ovnk-observ-rules.yaml. Do not edit.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ovnk-observ
  namespace: ovnk-observ
  labels:
    role: alert-rules
spec:
  groups:
    - name: ovnk-observ.rules
      interval: 30s
      rules:
        - record: ovnk:ovn_pod_node:info
          expr: |-
            max by (namespace, pod, node) (kube_pod_info{namespace="openshift-ovn-kubernetes"})
        - record: ovnk:nb_db_objects:sum_by_node_table
          expr: |-
            sum by (node, table) (max without (instance, pod, endpoint, container, service) (ovnkube_controller_nb_db_objects))
        - record: ovnk:nb_db_objects:max_by_table
          expr: |-
            max by (table) (ovnk:nb_db_objects:sum_by_node_table)
        - record: ovnk:nb_db_objects:max_by_network_table
          expr: |-
            max by (network, table) (sum by (node, network, table) (max without (instance, pod, endpoint, container, service) (ovnkube_controller_nb_db_objects)))
        - record: ovnk:portgroup_amplification:ratio
          expr: |-
            max(sum by (node) (max without (instance, pod, endpoint, container, service) (ovnkube_controller_nb_db_objects{table="Port_Group",owner_type="NetworkPolicy"}))) / clamp_min((sum(max without (instance, pod, endpoint, container, service) (ovnkube_clustermanager_multi_network_policies)) or vector(0)) + (sum(max without (instance, pod, endpoint, container, service) (ovnkube_clustermanager_network_policies)) or vector(0)), 1)
        - record: ovnk:nb_sb_effectiveness:ratio
          expr: |-
            sum by (node) (max without (instance, pod, endpoint, container, service) (ovnkube_controller_sb_db_objects{table="Logical_Flow"})) / clamp_min(sum by (node) (max without (instance, pod, endpoint, container, service) (ovnkube_controller_nb_db_objects{table="ACL"})), 1)
        - record: ovnk:network_programming:p99_1h
          expr: |-
            histogram_quantile(0.99, sum by (le) (rate(ovnkube_controller_network_programming_duration_seconds_bucket[1h])))
        - record: ovnk:network_programming:p99_1h_by_kind
          expr: |-
            histogram_quantile(0.99, sum by (le, kind) (rate(ovnkube_controller_network_programming_duration_seconds_bucket[1h])))
        - record: ovnk:pod_setup_stage:p99_1h
          expr: |-
            histogram_quantile(0.99, sum by (le) (rate(ovnkube_controller_pod_first_seen_lsp_created_duration_seconds_bucket[1h])))
          labels:
            stage: first_seen_lsp
        - record: ovnk:pod_setup_stage:p99_1h
          expr: |-
            histogram_quantile(0.99, sum by (le) (rate(ovnkube_controller_pod_lsp_created_port_binding_duration_seconds_bucket[1h])))
          labels:
            stage: lsp_port_binding
        - record: ovnk:pod_setup_stage:p99_1h
          expr: |-
            histogram_quantile(0.99, sum by (le) (rate(ovnkube_controller_pod_port_binding_port_binding_chassis_duration_seconds_bucket[1h])))
          labels:
            stage: port_binding_chassis
        - record: ovnk:pod_setup_stage:p99_1h
          expr: |-
            histogram_quantile(0.99, sum by (le) (rate(ovnkube_controller_pod_port_binding_chassis_port_binding_up_duration_seconds_bucket[1h])))
          labels:
            stage: chassis_up
        - record: ovnk:ovn_txn_failure:ratio_5m
          expr: |-
            (sum by (namespace, pod) (rate(ovn_northd_txn_error[5m]) + rate(ovn_northd_txn_try_again[5m]) + rate(ovn_northd_txn_aborted[5m])) / clamp_min(sum by (namespace, pod) (rate(ovn_northd_txn_success[5m]) + rate(ovn_northd_txn_error[5m]) + rate(ovn_northd_txn_try_again[5m]) + rate(ovn_northd_txn_aborted[5m])), 1e-9)) * on (namespace, pod) group_left(node) ovnk:ovn_pod_node:info
          labels:
            component: northd
        - record: ovnk:ovn_txn_failure:ratio_5m
          expr: |-
            (sum by (namespace, pod) (rate(ovn_controller_txn_error[5m]) + rate(ovn_controller_txn_try_again[5m]) + rate(ovn_controller_txn_aborted[5m])) / clamp_min(sum by (namespace, pod) (rate(ovn_controller_txn_success[5m]) + rate(ovn_controller_txn_error[5m]) + rate(ovn_controller_txn_try_again[5m]) + rate(ovn_controller_txn_aborted[5m])), 1e-9)) * on (namespace, pod) group_left(node) ovnk:ovn_pod_node:info
          labels:
            component: controller
        - record: ovnk:nb_sb_e2e_lag_seconds
          expr: |-
            (ovnkube_controller_nb_e2e_timestamp - ovnkube_controller_sb_e2e_timestamp) * on (namespace, pod) group_left(node) ovnk:ovn_pod_node:info
        - record: ovnk:e2e_probe_staleness_seconds
          expr: |-
            (time() - ovnkube_controller_nb_e2e_timestamp) * on (namespace, pod) group_left(node) ovnk:ovn_pod_node:info
        - record: ovnk:ovn_db_size_bytes:deriv_30m
          expr: |-
            deriv(ovn_db_db_size_bytes[30m]) * on (namespace, pod) group_left(node) ovnk:ovn_pod_node:info
        - record: ovnk:pg_drift:missing_by_node
          expr: |-
            max by (node) (max without (instance, pod, endpoint, container, service) (ovnkube_controller_port_group_sb_missing))
        - record: ovnk:pg_drift:nodes
          expr: |-
            count(ovnk:pg_drift:missing_by_node > 0) or vector(0)
        - record: ovnk:northd_recompute:ratio_15m
          expr: |-
            sum by (node, engine_node) (max without (instance, pod, endpoint, container, service) (increase(ovn_northd_inc_engine_runs_total{type="recompute"}[15m]))) / clamp_min(sum by (node, engine_node) (max without (instance, pod, endpoint, container, service) (increase(ovn_northd_inc_engine_runs_total{type=~"recompute|compute"}[15m]))), 1)
        - record: ovnk:northd_full_recompute:increase_5m
          expr: |-
            sum by (node) (max without (instance, pod, endpoint, container, service) (increase(ovn_northd_inc_engine_runs_total{engine_node="northd",type="recompute"}[5m])))
        - record: ovnk:object_events:rate_5m
          expr: |-
            sum by (resource, op) (rate(ovnkube_clustermanager_object_events_total[5m]))
        - alert: OVNKPortGroupAmplificationHigh
          expr: ovnk:portgroup_amplification:ratio > 10
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Port_Group amplification is {{ $value | printf \"%.1f\" }} NB Port_Groups per policy"
        - alert: OVNKNBDBObjectsHigh
          expr: ovnk:nb_db_objects:sum_by_node_table{table=~"ACL|Port_Group"} > 100000
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "NB {{ $labels.table }} count on {{ $labels.node }} is {{ $value | printf \"%.0f\" }}"
        - alert: OVNKNBDBGrowing
          expr: ovnk:ovn_db_size_bytes:deriv_30m{db_name="OVN_Northbound"} * 3600 > 50e6
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "OVN Northbound DB on {{ $labels.node }} is growing {{ $value | humanize }}B/h"
        - alert: OVNKPropagationLagHigh
          expr: ovnk:nb_sb_e2e_lag_seconds > 30
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "NB to SB propagation lag on {{ $labels.node }} is {{ $value | printf \"%.0f\" }}s"
        - alert: OVNKE2EProbeStale
          expr: ovnk:e2e_probe_staleness_seconds > 180
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "E2E probe on {{ $labels.node }} has not updated for {{ $value | printf \"%.0f\" }}s"
        - alert: OVNKTxnFailureRatioHigh
          expr: ovnk:ovn_txn_failure:ratio_5m > 0.05
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "OVN {{ $labels.component }} transaction failure ratio on {{ $labels.node }} is {{ $value | printf \"%.4f\" }}"
        - alert: OVNKNetworkProgrammingSlow
          expr: ovnk:network_programming:p99_1h > 10
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Network programming p99 latency is {{ $value | printf \"%.1f\" }}s"
            description: "p99 over a 1h window, so a single slow burst keeps this alert active for up to ~1h."
        - alert: OVNKPortGroupSBDrift
          expr: ovnk:pg_drift:missing_by_node > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $value | printf \"%.0f\" }} Port_Groups on {{ $labels.node }} are missing from the SB DB"
        - alert: OVNKNorthdRecomputeHigh
          expr: ovnk:northd_recompute:ratio_15m{engine_node=~"northd|lflow"} > 0.5
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "northd engine node {{ $labels.engine_node }} on {{ $labels.node }} recomputes {{ $value | humanizePercentage }} of the time over 15m"
        - alert: OVNKPolicyChurnHigh
          expr: sum(ovnk:object_events:rate_5m{resource="mnp",op="update"}) * 60 > 100
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "MultiNetworkPolicy updates are running at {{ $value | printf \"%.0f\" }} per minute"
