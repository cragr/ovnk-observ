apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ovnk-observ-node
  namespace: ovnk-observ
spec:
  selector:
    matchLabels:
      app: ovnk-observ-node
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 20s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ovnk-observ-cluster
  namespace: ovnk-observ
spec:
  selector:
    matchLabels:
      app: ovnk-observ-cluster
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 20s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
