              ],
              "format": "short",
              "valueName": "current",
              "decimals": 1,
              "options": {
                "fieldOptions": {
                  "thresholds": [
                    {
                      "color": "green",
                      "value": -1
                    },
                    {
                      "color": "light-yellow",
                      "value": 4.999999999999999
                    },
                    {
                      "color": "light-red",
                      "value": 9.999999999999998
                    }
                  ]
                }
              },
              "sparkline": {
                "show": false
              }
            },
            {
              "id": 5,
              "title": "Network programming p99",
              "type": "singlestat",
              "span": 2,
              "datasource": "$datasource",
              "description": "p99 over 5m; 'idle' = no network-programming events in the window",
              "targets": [
                {
                  "expr": "ovnk:network_programming:p99_5m",
                  "legendFormat": "",
                  "refId": "A"
                }
              ],
              "format": "s",
              "valueName": "current",
              "options": {
                "fieldOptions": {
                  "thresholds": [
                    {
                      "color": "green",
                      "value": -1
                    },
                    {
                      "color": "light-yellow",
                      "value": 1.9999999999999998
                    },
                    {
                      "color": "light-red",
                      "value": 9.999999999999998
                    }
                  ]
                }
              },
              "valueMaps": [
                {
                  "op": "=",
                  "text": "idle",
                  "value": "NaN"
                },
                {
                  "op": "=",
                  "text": "no data",
                  "value": "null"
                }
              ],
              "sparkline": {
                "show": false
              }
            },
            {
              "id": 6,
