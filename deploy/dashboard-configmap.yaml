              "type": "singlestat",
              "span": 1,
              "datasource": "$datasource",
              "targets": [
                {
                  "expr": "count(count by (namespace, pod) (ovn_northd_nb_connection_status == 0 or ovn_northd_sb_connection_status == 0 or ovn_controller_southbound_database_connected == 0)) or vector(0)",
                  "legendFormat": "",
                  "refId": "A"
                }
              ],
              "format": "short",
              "valueName": "current",
              "options": {
                "fieldOptions": {
                  "thresholds": [
                    {
                      "color": "green",
                      "value": -1
                    },
                    {
                      "color": "light-red",
                      "value": 0.5
                    }
                  ]
                }
              },
              "sparkline": {
                "show": false
              }
