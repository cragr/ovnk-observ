apiVersion: apps/v1
kind: Deployment
metadata:
  name: ovnk-observ-cluster
  namespace: ovnk-observ
  labels:
    app: ovnk-observ-cluster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ovnk-observ-cluster
  template:
    metadata:
      labels:
        app: ovnk-observ-cluster
    spec:
      serviceAccountName: ovnk-observ-cluster
      priorityClassName: ovnk-observ
      containers:
        - name: exporter
          # Tag comes from images: in kustomization.yaml (make set-version).
          image: quay.io/cragr/ovnk-observ-exporter
          imagePullPolicy: IfNotPresent
          args:
            - --mode=cluster
            - --listen=:9410
          ports:
            - name: metrics
              containerPort: 9410
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
