# With this annotation, OpenShift image policy admission resolves the short
# name ovnk-observ-exporter:latest to the ImageStream's current digest on every
# create and update, and stores that digest in the pod template. Re-applying
# leaves the spec unchanged, so it does not roll the pods (ImageStream triggers
# did: apply reset the image to the tag, then the trigger set the digest
# again). Because the stored template holds a digest, a restart keeps the old
# build; make image-dev runs oc set image with the short name to re-resolve it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: any
spec:
  template:
    metadata:
      annotations:
        alpha.image.policy.openshift.io/resolve-names: "*"
