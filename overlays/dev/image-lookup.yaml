# With this annotation, OpenShift image policy admission should resolve the
# short name ovnk-observ-exporter:latest to the ImageStream's current digest.
# On the lab (OCP 4.21.16) it did not: pods hit ImagePullBackOff because the
# kubelet tried docker.io. So make image-dev pins the pod templates to the
# ImageStream's digest with oc set image. make deploy (re-apply) resets the
# image to the short name, so run make image-dev after it. The annotation stays
# for clusters where admission does resolve the name.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: any
spec:
  template:
    metadata:
      annotations:
        alpha.image.policy.openshift.io/resolve-names: "*"
