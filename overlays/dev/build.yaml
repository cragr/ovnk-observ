apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: ovnk-observ-exporter
  namespace: ovnk-observ
spec:
  # Local lookup lets the short name ovnk-observ-exporter:latest resolve where
  # admission supports it. Pods do not rely on it: make image-dev pins them to
  # this ImageStream's digest (see overlays/dev/image-lookup.yaml).
  lookupPolicy:
    local: true
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: ovnk-observ-exporter
  namespace: ovnk-observ
spec:
  runPolicy: Serial
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile
  output:
    to:
      kind: ImageStreamTag
      name: ovnk-observ-exporter:latest
